[project]
name = "learnova"
version = "0.1.0"
description = "An AI teaching assistant for your study notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-deepseek>=1.2.1",
    "langchain-google-genai>=4.5.2",
    "langchain-openai>=1.8.5",
    "notion-client>=3.1.0",
    "pydantic>=2.14.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.9",
    "tomli-w>=1.2.0",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
learnova = "learnova.cli.main:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
